<!DOCTYPE html>
<html lang="id" data-font-size="md">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wafaabbas.com | Blog Akuntansi, Pajak, & Keuangan</title>
  <meta name="description" content="Blog edukasi akuntansi, perpajakan, dan keuangan oleh Wafa Abbas." />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <!-- ============================================================
       HEADER — Two-level sticky
       ============================================================ -->
  <header class="site-header">
    <!-- Top bar: brand + actions -->
    <div class="site-topbar">
      <div class="container">
        <a href="index.html" class="site-brand">
          <div class="site-logo" aria-hidden="true">W</div>
          <div class="site-brand-text">
            <span class="site-title">wafaabbas.com</span>
            <span class="site-tagline">Akuntansi · Perpajakan · Keuangan</span>
          </div>
        </a>
        <div class="site-topbar-actions">
          <a href="admin/login.html" class="btn-login">Login</a>
        </div>
      </div>
    </div>
    <!-- Nav bar: dynamic menu -->
    <div class="site-navbar">
      <div class="container">
        <nav id="site-navbar" aria-label="Navigasi utama"></nav>
      </div>
    </div>
  </header>

  <!-- ============================================================
       HERO — Banner iklan
       ============================================================ -->
  <section class="banner-section" id="bannerSection" hidden>
    <div class="container">
      <div id="bannerList" class="banner-list"></div>
    </div>
  </section>

  <!-- ============================================================
       HERO — Featured articles 70/30
       ============================================================ -->
  <section class="site-hero">
    <div class="container">
      <div class="layout-hero" id="featuredSection">
        <!-- Skeleton loading -->
        <div class="featured-card featured-card--skeleton"></div>
        <div class="featured-cards-stack">
          <div class="featured-card featured-card--sm featured-card--skeleton"></div>
          <div class="featured-card featured-card--sm featured-card--skeleton"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       MAIN CONTENT — Artikel terbaru
       ============================================================ -->
  <main class="container" style="margin-top: var(--space-10);">
    <section class="articles" aria-labelledby="articles-heading">
      <div class="section-header">
        <h2 id="articles-heading">Artikel Terbaru</h2>
        <a href="article.html" class="link-small">Lihat semua →</a>
      </div>

      <div id="article-list" class="article-list" data-articles-list>
        <!-- Loading skeleton -->
        <div class="article-card article-card--skeleton"></div>
        <div class="article-card article-card--skeleton"></div>
        <div class="article-card article-card--skeleton"></div>
      </div>
    </section>
  </main>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="site-footer">
    <div class="container">
      <small>&copy; <span id="year"></span> Wafa Abbas.</small>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="services/supabase.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/translate.js"></script>
  <script src="components/font-size-toggle.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
